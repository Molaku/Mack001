<!-- index.html (PART 1/2) -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get Official Mack Worldwide Warranty – Authorized Mack Agent</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --secondary: #64748b;
            --dark: #0f172a;
            --light: #f8fafc;
            --success: #22c55e;
            --error: #ef4444;
            --border: #e2e8f0;
            --card-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background-color: #ffffff; color: var(--dark); line-height: 1.6; overflow-x: hidden; padding-bottom: 100px; }
        
        .container { max-width: 1100px; margin: 0 auto; padding: 0 24px; }
        .section-padding { padding: 80px 0; }
        
        header { height: 80px; display: flex; align-items: center; border-bottom: 1px solid var(--border); background: white; sticky: top; }
        nav { display: flex; justify-content: space-between; align-items: center; width: 100%; }
        .logo { font-weight: 800; font-size: 1.25rem; color: var(--dark); letter-spacing: -0.025em; }
        .logo span { color: var(--primary); }
        .nav-links a { text-decoration: none; color: var(--secondary); font-weight: 500; font-size: 0.95rem; margin-left: 32px; }

        .hero { text-align: center; padding: 100px 0 60px; background: radial-gradient(circle at top, #f0f7ff 0%, #ffffff 100%); }
        .hero h1 { font-size: clamp(2.5rem, 5vw, 3.75rem); font-weight: 800; line-height: 1.1; margin-bottom: 24px; letter-spacing: -0.05em; }
        .hero p { font-size: 1.25rem; color: var(--secondary); max-width: 700px; margin: 0 auto 40px; }
        .trust-badge { display: inline-flex; align-items: center; background: #e0f2fe; color: #0369a1; padding: 8px 16px; border-radius: 100px; font-weight: 600; font-size: 0.875rem; margin-bottom: 24px; }
        
        .btn { display: inline-flex; align-items: center; justify-content: center; padding: 14px 32px; border-radius: 8px; font-weight: 600; text-decoration: none; transition: all 0.2s; cursor: pointer; border: none; font-size: 1rem; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover:not(:disabled) { background: var(--primary-hover); transform: translateY(-1px); }
        .btn-primary:disabled { background: #cbd5e1; cursor: not-allowed; }

        .grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 32px; margin-top: 48px; }
        .card { padding: 32px; border-radius: 16px; border: 1px solid var(--border); background: white; transition: transform 0.2s; }
        .card:hover { transform: translateY(-4px); box-shadow: var(--card-shadow); }
        .step-num { width: 32px; height: 32px; background: var(--primary); color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; margin-bottom: 20px; }
        
        .calculator-wrapper { background: var(--light); border-radius: 24px; padding: 48px; margin-top: 60px; border: 1px solid var(--border); }
        .calc-grid { display: grid; grid-template-columns: 1.2fr 0.8fr; gap: 48px; }
        .form-group { margin-bottom: 24px; }
        label { display: block; font-weight: 600; margin-bottom: 8px; font-size: 0.9rem; }
        select, input { width: 100%; padding: 12px 16px; border-radius: 8px; border: 1px solid var(--border); font-size: 1rem; font-family: inherit; }
        
        .summary-card { background: white; border-radius: 16px; padding: 32px; border: 1px solid var(--border); position: sticky; top: 20px; }
        .summary-row { display: flex; justify-content: space-between; margin-bottom: 12px; font-size: 0.9rem; }
        .price-display { font-size: 2.5rem; font-weight: 800; color: var(--dark); }
        .status-msg { margin: 16px 0; padding: 12px; border-radius: 8px; font-size: 0.85rem; font-weight: 500; display: none; }
        .status-msg.error { display: block; background: #fee2e2; color: #b91c1c; border: 1px solid #fecaca; }
        .status-msg.success { display: block; background: #f0fdf4; color: #15803d; border: 1px solid #bbf7d0; }
        
        .sticky-bar { position: fixed; bottom: 0; left: 0; right: 0; background: white; border-top: 1px solid var(--border); padding: 16px 0; z-index: 1000; box-shadow: 0 -4px 10px rgba(0,0,0,0.05); display: none; }
        .sticky-flex { display: flex; justify-content: space-between; align-items: center; }

        @media (max-width: 768px) {
            .calc-grid { grid-template-columns: 1fr; }
            .calculator-wrapper { padding: 24px; }
            .nav-links { display: none; }
        }
    </style>
</head>
<body>
    <header>
        <div class="container"><nav><div class="logo">MACK<span>AGENT</span></div><div class="nav-links"><a href="#calculator">Calculator</a><a href="mailto:EMAIL@GMAIL.COM">Contact</a></div></nav></div>
    </header>

    <section class="hero">
        <div class="container">
            <div class="trust-badge">✓ Authorized Mack Agent (12+ Years)</div>
            <h1>Get Official Mack Worldwide Warranty</h1>
            <p>Reliable protection for your gear at a great price. Professional service you can trust.</p>
            <button onclick="document.getElementById('calculator').scrollIntoView({behavior: 'smooth'})" class="btn btn-primary">Calculate Price</button>
        </div>
    </section>

    <section id="calculator" class="section-padding">
        <div class="container">
            <div class="calculator-wrapper">
                <div class="calc-grid">
                    <div class="calc-inputs">
                        <div class="form-group">
                            <label>Gear Location</label>
                            <select id="location" onchange="updateUI()">
                                <option value="USA">United States</option>
                                <option value="INTL">Outside USA</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Plan</label>
                            <select id="plan" onchange="updateUI()"></select>
                        </div>
                        <div class="form-group">
                            <label>Duration</label>
                            <select id="duration" onchange="calculate()"></select>
                        </div>
                        <div class="form-group">
                            <label>Purchase Date</label>
                            <input type="date" id="purchaseDate" onchange="calculate()">
                        </div>
                        <div class="form-group">
                            <label>Invoice Total (USD)</label>
                            <input type="number" id="invoiceTotal" oninput="calculate()">
                        </div>
                        <div class="form-group">
                            <label style="display:flex; align-items:center; gap:8px;">
                                <input type="checkbox" id="mfgVerify" onchange="calculate()" style="width:auto;"> 
                                <span>I confirm 90+ days remain on manufacturer warranty.</span>
                            </label>
                        </div>
                    </div>
                    <div class="calc-results">
                        <div class="summary-card">
                            <h3>Quote Summary</h3>
                            <div id="summaryContent" style="margin: 20px 0;"></div>
                            <div class="price-display" id="finalPrice">—</div>
                            <div id="statusMsg" class="status-msg"></div>
                            <button id="payBtn" disabled class="btn btn-primary" style="width: 100%;">Pay with PayPal</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <div id="stickyBar" class="sticky-bar"><div class="container"><div class="sticky-flex"><div><div id="stickyStatus" style="font-size:0.8rem; font-weight:700;"></div><div id="stickyPrice" style="font-size:1.25rem; font-weight:800;">—</div></div><button id="stickyBtn" disabled class="btn btn-primary">Pay with PayPal</button></div></div></div>
<!-- index.html (PART 2/2) -->
    <script>
        let pricingData = null;

        async function init() {
            try {
                const response = await fetch('pricing.json');
                pricingData = await response.json();
                updateUI();
            } catch (e) { console.error("Pricing error", e); }
        }

        function updateUI() {
            const loc = document.getElementById('location').value;
            const planSelect = document.getElementById('plan');
            const durSelect = document.getElementById('duration');
            
            planSelect.innerHTML = '';
            if (loc === 'USA') {
                planSelect.add(new Option('Standard (Worldwide)', 'standard'));
                planSelect.add(new Option('Diamond USA', 'diamond_us'));
            } else {
                planSelect.add(new Option('Standard (Worldwide)', 'standard'));
                planSelect.add(new Option('Diamond International', 'diamond_intl'));
            }

            const plan = planSelect.value;
            durSelect.innerHTML = '';
            if (plan === 'standard') {
                ['1y', '3y', '5y'].forEach(v => durSelect.add(new Option(v.replace('y',' Year(s)'), v)));
            } else if (plan === 'diamond_us') {
                ['2y', '3y', '5y'].forEach(v => durSelect.add(new Option(v.replace('y',' Year(s)'), v)));
            } else {
                durSelect.add(new Option('3 Years', '3y'));
            }
            calculate();
        }

        function calculate() {
            if (!pricingData) return;
            const plan = document.getElementById('plan').value;
            const duration = document.getElementById('duration').value;
            const purchaseDateStr = document.getElementById('purchaseDate').value;
            const invoiceTotal = parseFloat(document.getElementById('invoiceTotal').value);
            const mfgChecked = document.getElementById('mfgVerify').checked;
            
            const statusBox = document.getElementById('statusMsg');
            const payBtn = document.getElementById('payBtn');
            const stickyBtn = document.getElementById('stickyBtn');
            const priceEl = document.getElementById('finalPrice');
            const stickyBar = document.getElementById('stickyBar');

            if (!invoiceTotal || !purchaseDateStr) {
                priceEl.innerText = "—";
                statusBox.style.display = 'none';
                return;
            }

            const diffDays = Math.floor((new Date() - new Date(purchaseDateStr)) / (1000 * 60 * 60 * 24));
            let error = null;
            let price = null;

            if (plan.startsWith('diamond') && diffDays > 30) {
                error = "Diamond requires purchase within 30 days of gear purchase.";
            } else if (plan === 'standard' && !mfgChecked) {
                error = "Please confirm 90+ days remain on mfg warranty.";
            }

            const table = pricingData.tables[`${plan}_${duration}`];
            const band = table ? table.find(b => invoiceTotal <= b.max) : null;
            
            if (table && !band) {
                error = "Invoice exceeds limit. <a href='mailto:EMAIL@GMAIL.COM'>Contact for quote</a>";
            } else if (band) {
                price = band.price;
            }

            priceEl.innerText = price ? `$${price}` : "—";
            document.getElementById('stickyPrice').innerText = price ? `$${price}` : "—";
            
            if (error) {
                statusBox.className = "status-msg error";
                statusBox.innerHTML = error;
                payBtn.disabled = stickyBtn.disabled = true;
            } else {
                statusBox.className = "status-msg success";
                statusBox.innerText = "Eligible for protection.";
                payBtn.disabled = stickyBtn.disabled = false;
            }

            payBtn.onclick = stickyBtn.onclick = () => window.open(`https://paypal.me/Test007/${price}`, '_blank');
            stickyBar.style.display = 'block';
            
            document.getElementById('summaryContent').innerHTML = `
                <div class="summary-row"><span>Plan:</span><span>${plan}</span></div>
                <div class="summary-row"><span>Invoice:</span><span>$${invoiceTotal}</span></div>
            `;
        }
        window.onload = init;
    </script>
</body>
</html>
